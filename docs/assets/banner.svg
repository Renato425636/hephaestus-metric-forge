<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hephaestus Metric Forge: a divine anvil wreathed in flame beneath a sunburst halo, struck by a hammer whose sparks rise and turn into a bar chart, representing metrics forged from raw data.">
  <defs>
    <radialGradient id="glow" cx="19.5%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#ff7a33" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff7a33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5f2e"/>
      <stop offset="100%" stop-color="#ffc24b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5f2e"/>
      <stop offset="100%" stop-color="#ffc24b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#59504a"/>
      <stop offset="100%" stop-color="#332c28"/>
    </linearGradient>
    <linearGradient id="flame-outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9350f"/>
      <stop offset="55%" stop-color="#ff6a2a"/>
      <stop offset="100%" stop-color="#ffb141"/>
    </linearGradient>
    <linearGradient id="flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="300" fill="#15100e"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#glow)"/>

  <!-- classical frieze border, top and bottom -->
  <rect x="0" y="16" width="1200" height="2" fill="#ff7a33" opacity="0.55"/>
  <rect x="0" y="282" width="1200" height="2" fill="#ff7a33" opacity="0.55"/>
  <g stroke="#ffb454" stroke-width="1.5" opacity="0.5">
    <line x1="20" y1="18" x2="20" y2="24"/><line x1="50" y1="18" x2="50" y2="24"/><line x1="80" y1="18" x2="80" y2="24"/>
    <line x1="110" y1="18" x2="110" y2="24"/><line x1="140" y1="18" x2="140" y2="24"/><line x1="170" y1="18" x2="170" y2="24"/>
    <line x1="200" y1="18" x2="200" y2="24"/><line x1="230" y1="18" x2="230" y2="24"/><line x1="260" y1="18" x2="260" y2="24"/>
    <line x1="290" y1="18" x2="290" y2="24"/><line x1="320" y1="18" x2="320" y2="24"/><line x1="350" y1="18" x2="350" y2="24"/>
    <line x1="380" y1="18" x2="380" y2="24"/><line x1="410" y1="18" x2="410" y2="24"/><line x1="440" y1="18" x2="440" y2="24"/>
    <line x1="470" y1="18" x2="470" y2="24"/><line x1="500" y1="18" x2="500" y2="24"/><line x1="530" y1="18" x2="530" y2="24"/>
    <line x1="560" y1="18" x2="560" y2="24"/><line x1="590" y1="18" x2="590" y2="24"/><line x1="620" y1="18" x2="620" y2="24"/>
    <line x1="650" y1="18" x2="650" y2="24"/><line x1="680" y1="18" x2="680" y2="24"/><line x1="710" y1="18" x2="710" y2="24"/>
    <line x1="740" y1="18" x2="740" y2="24"/><line x1="770" y1="18" x2="770" y2="24"/><line x1="800" y1="18" x2="800" y2="24"/>
    <line x1="830" y1="18" x2="830" y2="24"/><line x1="860" y1="18" x2="860" y2="24"/><line x1="890" y1="18" x2="890" y2="24"/>
    <line x1="920" y1="18" x2="920" y2="24"/><line x1="950" y1="18" x2="950" y2="24"/><line x1="980" y1="18" x2="980" y2="24"/>
    <line x1="1010" y1="18" x2="1010" y2="24"/><line x1="1040" y1="18" x2="1040" y2="24"/><line x1="1070" y1="18" x2="1070" y2="24"/>
    <line x1="1100" y1="18" x2="1100" y2="24"/><line x1="1130" y1="18" x2="1130" y2="24"/><line x1="1160" y1="18" x2="1160" y2="24"/>
  </g>
  <g stroke="#ffb454" stroke-width="1.5" opacity="0.5">
    <line x1="20" y1="276" x2="20" y2="282"/><line x1="50" y1="276" x2="50" y2="282"/><line x1="80" y1="276" x2="80" y2="282"/>
    <line x1="110" y1="276" x2="110" y2="282"/><line x1="140" y1="276" x2="140" y2="282"/><line x1="170" y1="276" x2="170" y2="282"/>
    <line x1="200" y1="276" x2="200" y2="282"/><line x1="230" y1="276" x2="230" y2="282"/><line x1="260" y1="276" x2="260" y2="282"/>
    <line x1="290" y1="276" x2="290" y2="282"/><line x1="320" y1="276" x2="320" y2="282"/><line x1="350" y1="276" x2="350" y2="282"/>
    <line x1="380" y1="276" x2="380" y2="282"/><line x1="410" y1="276" x2="410" y2="282"/><line x1="440" y1="276" x2="440" y2="282"/>
    <line x1="470" y1="276" x2="470" y2="282"/><line x1="500" y1="276" x2="500" y2="282"/><line x1="530" y1="276" x2="530" y2="282"/>
    <line x1="560" y1="276" x2="560" y2="282"/><line x1="590" y1="276" x2="590" y2="282"/><line x1="620" y1="276" x2="620" y2="282"/>
    <line x1="650" y1="276" x2="650" y2="282"/><line x1="680" y1="276" x2="680" y2="282"/><line x1="710" y1="276" x2="710" y2="282"/>
    <line x1="740" y1="276" x2="740" y2="282"/><line x1="770" y1="276" x2="770" y2="282"/><line x1="800" y1="276" x2="800" y2="282"/>
    <line x1="830" y1="276" x2="830" y2="282"/><line x1="860" y1="276" x2="860" y2="282"/><line x1="890" y1="276" x2="890" y2="282"/>
    <line x1="920" y1="276" x2="920" y2="282"/><line x1="950" y1="276" x2="950" y2="282"/><line x1="980" y1="276" x2="980" y2="282"/>
    <line x1="1010" y1="276" x2="1010" y2="282"/><line x1="1040" y1="276" x2="1040" y2="282"/><line x1="1070" y1="276" x2="1070" y2="282"/>
    <line x1="1100" y1="276" x2="1100" y2="282"/><line x1="1130" y1="276" x2="1130" y2="282"/><line x1="1160" y1="276" x2="1160" y2="282"/>
  </g>

  <!-- sunburst halo behind the flame, evoking a forge-god's aura -->
  <g stroke="#ffb454" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="343.0" y1="150.0" x2="357.0" y2="150.0"/>
    <line x1="127.0" y1="150.0" x2="113.0" y2="150.0"/>
    <line x1="130.7" y1="122.0" x2="117.2" y2="118.4"/>
    <line x1="141.5" y1="96.0" x2="129.3" y2="89.0"/>
    <line x1="158.6" y1="73.6" x2="148.7" y2="63.7"/>
    <line x1="181.0" y1="56.5" x2="174.0" y2="44.3"/>
    <line x1="207.0" y1="45.7" x2="203.4" y2="32.2"/>
    <line x1="235.0" y1="42.0" x2="235.0" y2="28.0"/>
    <line x1="263.0" y1="45.7" x2="266.6" y2="32.2"/>
    <line x1="289.0" y1="56.5" x2="296.0" y2="44.3"/>
    <line x1="311.4" y1="73.6" x2="321.3" y2="63.7"/>
    <line x1="328.5" y1="96.0" x2="340.7" y2="89.0"/>
    <line x1="339.3" y1="122.0" x2="352.8" y2="118.4"/>
  </g>

  <!-- flame, rising from the anvil's table -->
  <path d="M235,45 C255,75 271,95 261,125 C255,143 245,151 235,151
           C225,151 215,143 209,125 C199,95 215,75 235,45 Z" fill="url(#flame-outer)"/>
  <path d="M235,67 C246,87 254,101 248,121 C244,132 239,137 235,137
           C231,137 226,132 222,121 C216,101 224,87 235,67 Z" fill="url(#flame-inner)"/>

  <!-- anvil -->
  <g>
    <polygon points="95,178 170,150 170,192" fill="url(#steel)"/>
    <rect x="168" y="150" width="172" height="42" rx="3" fill="url(#steel)"/>
    <rect x="175" y="150" width="158" height="8" fill="#6b6058" opacity="0.7"/>
    <rect x="225" y="192" width="80" height="18" fill="url(#steel)"/>
    <rect x="185" y="210" width="160" height="18" rx="3" fill="url(#steel)"/>
  </g>

  <!-- hammer mid-strike -->
  <g transform="rotate(-32 300 118)">
    <rect x="278" y="70" width="46" height="24" rx="3" fill="#4a4038"/>
    <rect x="296" y="94" width="10" height="70" fill="#7a6a58"/>
  </g>

  <!-- sparks trailing from the strike point toward the wordmark -->
  <g fill="url(#spark)">
    <circle cx="300" cy="140" r="5"/>
    <circle cx="330" cy="118" r="4"/>
    <circle cx="365" cy="128" r="3.5"/>
    <circle cx="405" cy="100" r="3"/>
    <circle cx="450" cy="112" r="3"/>
    <circle cx="495" cy="86" r="2.6"/>
  </g>
  <g stroke="url(#spark)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="300" y1="140" x2="312" y2="122"/>
    <line x1="300" y1="140" x2="290" y2="118"/>
    <line x1="330" y1="118" x2="338" y2="100"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" fill="#f4efe8">
    <text x="600" y="120" font-size="46" font-weight="700" letter-spacing="4" text-anchor="middle">HEPHAESTUS</text>
    <text x="600" y="164" font-size="30" font-weight="600" letter-spacing="6" fill="#ffb454" text-anchor="middle">METRIC FORGE</text>
    <text x="600" y="200" font-size="17" fill="#a89a8c" text-anchor="middle">Stateless metrics &amp; functions API — FastAPI + Polars</text>
  </g>

  <!-- metrics bar chart, freshly forged and still glowing -->
  <g>
    <rect x="946" y="190" width="26" height="40" rx="2" fill="url(#bar)"/>
    <rect x="984" y="160" width="26" height="70" rx="2" fill="url(#bar)"/>
    <rect x="1022" y="130" width="26" height="100" rx="2" fill="url(#bar)"/>
    <rect x="1060" y="150" width="26" height="80" rx="2" fill="url(#bar)"/>
    <rect x="1098" y="105" width="26" height="125" rx="2" fill="url(#bar)"/>
    <g fill="#ffe9a8" opacity="0.9">
      <polygon points="946,190 959,178 972,190"/>
      <polygon points="984,160 997,148 1010,160"/>
      <polygon points="1022,130 1035,116 1048,130"/>
      <polygon points="1060,150 1073,138 1086,150"/>
      <polygon points="1098,105 1111,91 1124,105"/>
    </g>
    <line x1="936" y1="230" x2="1134" y2="230" stroke="#4a4038" stroke-width="2"/>
  </g>
</svg>
