<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hephaestus Metric Forge emblem: an anvil wreathed in flame inside a sunburst ring, in the style of a Greek forge-god crest.">
  <defs>
    <radialGradient id="ic-bg" cx="50%" cy="60%" r="65%">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#140d0a"/>
    </radialGradient>
    <linearGradient id="ic-flame-outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9350f"/>
      <stop offset="55%" stop-color="#ff6a2a"/>
      <stop offset="100%" stop-color="#ffb141"/>
    </linearGradient>
    <linearGradient id="ic-flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>
    <linearGradient id="ic-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#635649"/>
      <stop offset="100%" stop-color="#2c2521"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="97" fill="url(#ic-bg)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#ffb454" stroke-width="2" opacity="0.9"/>

  <!-- sunburst / classical ring, evoking a forge-god's crest -->
  <g stroke="#ffb454" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="100.0" y1="10.0" x2="100.0" y2="3.0"/>
    <line x1="120.0" y1="12.3" x2="120.9" y2="8.4"/>
    <line x1="139.0" y1="18.9" x2="142.1" y2="12.6"/>
    <line x1="156.1" y1="29.6" x2="158.6" y2="26.5"/>
    <line x1="170.4" y1="43.9" x2="175.8" y2="39.5"/>
    <line x1="181.1" y1="61.0" x2="184.7" y2="59.2"/>
    <line x1="187.7" y1="80.0" x2="194.6" y2="78.4"/>
    <line x1="190.0" y1="100.0" x2="194.0" y2="100.0"/>
    <line x1="187.7" y1="120.0" x2="194.6" y2="121.6"/>
    <line x1="181.1" y1="139.0" x2="184.7" y2="140.8"/>
    <line x1="170.4" y1="156.1" x2="175.8" y2="160.5"/>
    <line x1="156.1" y1="170.4" x2="158.6" y2="173.5"/>
    <line x1="139.0" y1="181.1" x2="142.1" y2="187.4"/>
    <line x1="120.0" y1="187.7" x2="120.9" y2="191.6"/>
    <line x1="100.0" y1="190.0" x2="100.0" y2="197.0"/>
    <line x1="80.0" y1="187.7" x2="79.1" y2="191.6"/>
    <line x1="61.0" y1="181.1" x2="57.9" y2="187.4"/>
    <line x1="43.9" y1="170.4" x2="41.4" y2="173.5"/>
    <line x1="29.6" y1="156.1" x2="24.2" y2="160.5"/>
    <line x1="18.9" y1="139.0" x2="15.3" y2="140.8"/>
    <line x1="12.3" y1="120.0" x2="5.4" y2="121.6"/>
    <line x1="10.0" y1="100.0" x2="6.0" y2="100.0"/>
    <line x1="12.3" y1="80.0" x2="5.4" y2="78.4"/>
    <line x1="18.9" y1="61.0" x2="15.3" y2="59.2"/>
    <line x1="29.6" y1="43.9" x2="24.2" y2="39.5"/>
    <line x1="43.9" y1="29.6" x2="41.4" y2="26.5"/>
    <line x1="61.0" y1="18.9" x2="57.9" y2="12.6"/>
    <line x1="80.0" y1="12.3" x2="79.1" y2="8.4"/>
  </g>

  <!-- flame, rising behind the anvil -->
  <path d="M100,34 C120,64 136,84 126,114 C120,132 110,140 100,140
           C90,140 80,132 74,114 C64,84 80,64 100,34 Z" fill="url(#ic-flame-outer)"/>
  <path d="M100,56 C111,76 119,90 113,110 C109,121 104,126 100,126
           C96,126 91,121 87,110 C81,90 89,76 100,56 Z" fill="url(#ic-flame-inner)"/>

  <!-- anvil, grounded in front of the flame -->
  <g>
    <polygon points="48,132 84,120 84,142" fill="url(#ic-steel)"/>
    <rect x="82" y="120" width="76" height="24" rx="2" fill="url(#ic-steel)"/>
    <rect x="86" y="120" width="68" height="5" fill="#7a6c5e" opacity="0.7"/>
    <rect x="105" y="144" width="34" height="10" fill="url(#ic-steel)"/>
    <rect x="92" y="154" width="60" height="10" rx="2" fill="url(#ic-steel)"/>
  </g>
</svg>
